<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KitaPlay Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.5/controls.min.css" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.5/shaka-player.compiled.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.5/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #video-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    #error-message {
      color: red;
      padding: 20px;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 100;
      background: rgba(0,0,0,0.8);
    }
    video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" autoplay controls data-shaka-player></video>
    <div id="error-message"></div>
  </div>

  <script>
    // Video sources configuration
    const VIDEO_SOURCES = {
      sss: {
        url: "https://fta4-cdn-flr.visionplus.id/out/v1/6f5596513af749c19d0bcdac013dda3c/index.mpd",
        drm: {
          clearKeys: {
            "7faf299c35d84c57ba6cf3578df1e0cc": "636537eab0d3f7c395721811fd3861c5"
          }
        }
      }
    };

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', initPlayer);

    async function initPlayer() {
      try {
        const videoData = getVideoDataFromURL();
        if (!videoData) return;
        
        await initShakaPlayer(videoData);
      } catch (error) {
        showError(error.message || 'Failed to initialize player');
        console.error("Initialization error:", error);
      }
    }

    function getVideoDataFromURL() {
      try {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        if (!id) {
          showError('No video ID specified in URL');
          return null;
        }
        
        if (!VIDEO_SOURCES[id]) {
          showError(`Video source not found for ID: ${id}`);
          return null;
        }
        
        return VIDEO_SOURCES[id];
      } catch (error) {
        showError('Error processing URL parameters');
        console.error("URL processing error:", error);
        return null;
      }
    }

    async function initShakaPlayer(videoData) {
      // Check if Shaka Player is loaded
      if (typeof shaka === 'undefined') {
        throw new Error('Shaka Player library failed to load');
      }

      // Install polyfills
      shaka.polyfill.installAll();

      // Check browser support
      if (!shaka.Player.isBrowserSupported()) {
        throw new Error('Browser not supported for playback');
      }

      const videoElement = document.getElementById('video');
      const player = new shaka.Player(videoElement);
      
      // Initialize UI
      const ui = new shaka.ui.Overlay(
        player,
        videoElement,
        document.getElementById('video-container')
      );

      // Error handling
      player.addEventListener('error', (event) => {
        handlePlayerError(event.detail);
      });

      // Configure player
      player.configure({
        drm: videoData.drm,
        streaming: {
          bufferingGoal: 60,
          rebufferingGoal: 2
        }
      });

      // Try to load the video
      try {
        await player.load(videoData.url);
        console.log('Video loaded successfully');
      } catch (error) {
        throw new Error(`Failed to load video: ${error.message}`);
      }
    }

    function handlePlayerError(error) {
      let errorMessage = `Playback Error (${error.code}): `;
      
      // Specific error messages for common cases
      switch (error.code) {
        case shaka.util.Error.Code.BAD_DRM_CONFIG:
          errorMessage += "DRM configuration error - please check your keys";
          break;
        case shaka.util.Error.Code.REQUESTED_KEY_SYSTEM_CONFIG_UNAVAILABLE:
          errorMessage += "DRM system not available in this browser";
          break;
        case shaka.util.Error.Code.UNABLE_TO_GUESS_MANIFEST_TYPE:
          errorMessage += "Invalid video URL or format";
          break;
        default:
          errorMessage += error.message || "Unknown playback error";
      }
      
      showError(errorMessage);
      console.error("Player error:", error);
    }

    function showError(message) {
      const errorElement = document.getElementById('error-message');
      if (errorElement) {
        errorElement.innerHTML = `
          <h3>Error Loading Content</h3>
          <p>${message}</p>
          <p>Please try again or contact support.</p>
        `;
        errorElement.style.display = 'block';
      }
    }
  </script>
</body>
</html>
