
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.5/controls.min.css" crossorigin="anonymous"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.5/shaka-player.compiled.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.5/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <script src="https://shaka.pisionpluss3.workers.dev/xplay/rasio.js"></script>
  <link href="https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">  
  <style>
    body { margin:0; background-color: #000; color: #aaa; font-family: Poppins, sans-serif; }
    #vidio { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return false" onmousedown="return false">
  <div id="vidio" data-shaka-player-container class="fit">
    <video autoplay data-shaka-player id="xystv" style="width:100%;height:100%;"></video>
  </div>

  <script>
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    const videoId = getUrlParameter('id');
    const video = document.getElementById('xystv');
    if (videoId) video.id = videoId;

    const videoMapping = {
      "ss12": {
        url: "https://fta4-cdn-flr.visionplus.id/out/v1/00f8003079de4928bca50fe7c346b6ab/index.mpd",
        key: "5d5d9e0bb2cd4cd8954a894fd4377b6f:8c08b699ff6bff8e34ac518b334bafc2"
      },
      "ss22": {
        url: "https://example.com/video2.mpd",
        key: "5d5d9e0bb2cd4cd8954a894fd4377b6f:8c08b699ff6bff8e34ac518b334bafc2"
      },
      "sss": {
        url: "https://fta4-cdn-flr.visionplus.id/out/v1/6f5596513af749c19d0bcdac013dda3c/index.mpd",
        key: "7faf299c35d84c57ba6cf3578df1e0cc:636537eab0d3f7c395721811fd3861c5"
      }
    };

    async function initializePlayer(id, url, drmKeys) {
      const video = document.getElementById(id);
      if (!video) return console.error("Video element not found");

      const ui = video["ui"];
      if (!ui) return console.error("Shaka UI not found");

      const controls = ui.getControls();
      const player = controls.getPlayer();

      ui.configure({
        controlPanelElements: ["play_pause", "time_and_duration", "mute", "fullscreen"],
        playbackRates: [0.5, 1, 1.5, 2],
        seekBarColors: {
          base: "rgba(255,255,255,.2)",
          buffered: "rgba(255,255,255,.4)",
          played: "rgb(255,0,0)"
        }
      });

      const drmKeyObj = {};
      drmKeys.split(";").forEach(pair => {
        const [key, value] = pair.split(":");
        if (key && value) drmKeyObj[key.trim()] = value.trim();
      });

      player.configure({ drm: { clearKeys: drmKeyObj } });

      try {
        await player.load(url);
        console.log("Video loaded!");
      } catch (e) {
        console.error("Load failed", e);
      }
    }

    document.addEventListener("shaka-ui-loaded", () => {
      if (videoId && videoMapping[videoId]) {
        const { url, key } = videoMapping[videoId];
        initializePlayer(videoId, url, key);
      }
    });
  </script>
</body>
</html>
